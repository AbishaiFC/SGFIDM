<div class="sgfidm-theme root-layout" style="display: flex; height: 100dvh; overflow: hidden;">
  <!-- Auth, configuración inicial y POS son pantallas a todo ancho, sin Sidebar -->
  @if (!isAuthRoute()) {
    <sgfidm-sidebar
      [rol]="contexto().rol"
      [modo]="contexto().modo"
      [nombreNegocio]="contexto().nombreNegocio"
      [nombreUsuario]="contexto().nombreUsuario"
      [codigoEmpleado]="contexto().codigoEmpleado"
      [estado]="estadoSidebar()"
      (alternar)="alternarSidebar()"
    />
  }

  <!-- Contenido principal -->
  <main class="contenido" style="flex: 1; overflow: auto; background: var(--sgfidm-color-background); padding: var(--sgfidm-space-8) var(--sgfidm-space-14) var(--sgfidm-space-10) var(--sgfidm-space-14);">
    <router-outlet />
  </main>
</div>
