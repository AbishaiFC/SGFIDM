<div class="emp-page">
  <sgfidm-auth-card
    title="Configuración de acceso"
    subtitle="Primer acceso: vincula tu teléfono o crea tu contraseña para activar tu cuenta."
    [showLogo]="false"
    [wide]="true"
  >
    <div class="emp-opciones">
      <div class="emp-opcion">
        <div class="emp-opcion__info">
          <h2 class="emp-opcion__titulo">Vincular teléfono</h2>
          <p class="emp-opcion__detalle">Recibe un código de verificación por SMS.</p>
        </div>
        <sgfidm-button type="secondary" size="md" [width]="'110px'" [height]="'44px'" (click)="onVincularTelefono()">Vincular</sgfidm-button>
      </div>

      <div class="emp-opcion">
        <div class="emp-opcion__info">
          <h2 class="emp-opcion__titulo">Establecer contraseña</h2>
          <p class="emp-opcion__detalle">Crea tu contraseña personal de acceso.</p>
        </div>
        <sgfidm-button type="primary" size="md" [width]="'110px'" [height]="'44px'" (click)="onEstablecerContrasena()">Crear</sgfidm-button>
      </div>
    </div>
  </sgfidm-auth-card>
</div>
