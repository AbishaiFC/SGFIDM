<div class="emp-page">
  <sgfidm-auth-card
    title="Verificación OTP"
    subtitle="Ingresa tu número de teléfono para recibir un código de verificación."
    [showLogo]="false"
    [wide]="true"
  >
    <div class="emp-form">
      <sgfidm-form-field
        label="Número de teléfono"
        type="tel"
        placeholder="+52"
        [(value)]="telefono"
        [required]="true"
      />
      @if (errorMessage) {
        <p class="emp-error" role="alert">{{ errorMessage }}</p>
      }
    </div>

    <div class="emp-actions">
      <sgfidm-button type="primary" size="md" [fullWidth]="true" [height]="'56px'" (click)="onEnviarCodigo()">
        <span class="material-symbols-outlined emp-icon" aria-hidden="true">send</span>
        Enviar código
      </sgfidm-button>
    </div>
  </sgfidm-auth-card>
</div>
