<div class="emp-page">
  <sgfidm-auth-card
    title="Acceso de empleado"
    subtitle="Ingresa tu código de empleado y contraseña para acceder."
    [showLogo]="false"
    [wide]="true"
  >
    <div class="emp-form">
      <sgfidm-form-field
        label="Código de empleado"
        placeholder="EMP-001"
        helperText="Formato: EMP-XXX"
        [(value)]="codigo"
        [required]="true"
      />
      <sgfidm-password-field
        label="Contraseña"
        placeholder="••••••••"
        [(value)]="password"
      />
      @if (errorMessage) {
        <p class="emp-error" role="alert">{{ errorMessage }}</p>
      }
    </div>

    <div class="emp-actions">
      <sgfidm-button type="primary" size="md" [fullWidth]="true" [height]="'56px'" [loading]="isLoading" [disabled]="isLoading" (click)="onLogin()">
        <sgfidm-icon class="sgfidm-icon emp-icon" [name]="'arrow_forward'"></sgfidm-icon>
        Iniciar sesión
      </sgfidm-button>
    </div>

    <div class="emp-links">
      <a class="emp-link" routerLink="/auth/recover-account">Recuperar contraseña</a>
      <a class="emp-link" routerLink="/auth/employee/verify-phone">Verificación por OTP</a>
    </div>
  </sgfidm-auth-card>
</div>
