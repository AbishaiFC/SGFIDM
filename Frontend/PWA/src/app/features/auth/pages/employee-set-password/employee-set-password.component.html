<div class="emp-page">
  <sgfidm-auth-card
    title="Crea tu contraseña personal"
    subtitle="La contraseña debe tener al menos 8 caracteres, una mayúscula y un número."
    [showLogo]="false"
    [wide]="true"
  >
    @if (errorMessage) {
      <div class="emp-error-aviso" role="alert">
        <span class="material-symbols-outlined" aria-hidden="true">error_outline</span>
        <span>{{ errorMessage }}</span>
      </div>
    }

    <div class="emp-form">
      <sgfidm-password-field
        label="Nueva contraseña"
        placeholder="Nueva contraseña"
        helperText="Al menos 8 caracteres, una mayúscula y un número."
        [(value)]="nuevaPassword"
      />
      <sgfidm-password-field
        label="Confirmar contraseña"
        placeholder="Confirmar contraseña"
        helperText="Las contraseñas deben coincidir."
        [errorMessage]="confirmError"
        [(value)]="confirmarPassword"
      />
    </div>

    <div class="emp-actions">
      <sgfidm-button type="primary" size="md" [fullWidth]="true" [height]="'56px'" (click)="onGuardar()">
        <span class="material-symbols-outlined emp-icon" aria-hidden="true">save</span>
        Guardar contraseña
      </sgfidm-button>
    </div>
  </sgfidm-auth-card>
</div>
