<div class="emp-page">
  <sgfidm-auth-card
    title="Código de verificación"
    subtitle="Enviamos un código de 6 dígitos al teléfono terminado en ******6677"
    [showLogo]="false"
    [wide]="true"
  >
    <div class="emp-otp">
      <sgfidm-pin-field title="" subtitle="" (pinComplete)="onVerificar($event)" />
    </div>

    <div class="emp-otp-footer">
      <p class="emp-warning">El código expira en 05:00</p>
      @if (errorMessage) {
        <p class="emp-error" role="alert">{{ errorMessage }}</p>
      }
    </div>

    <div class="emp-actions">
      <sgfidm-button type="primary" size="md" [fullWidth]="true" [height]="'56px'" [loading]="isLoading" [disabled]="isLoading" (click)="onVerificar(otp)">
        <span class="material-symbols-outlined emp-icon" aria-hidden="true">check</span>
        Verificar
      </sgfidm-button>
    </div>

    <a class="emp-link emp-link--reenviar" (click)="onReenviar()">
      <span class="material-symbols-outlined emp-icon" aria-hidden="true">send</span>
      Reenviar código
    </a>

    <p class="emp-helper">
      Si no recibes el código, verifica que el teléfono sea correcto o contacta a tu administrador.
    </p>
  </sgfidm-auth-card>
</div>
