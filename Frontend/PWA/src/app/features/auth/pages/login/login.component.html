<div class="login-page">
  <sgfidm-login-organism
    title="Inicia sesión"
    subtitle="Accede con la cuenta de administrador que registraste."
    [errorMessage]="errorMessage()"
    [loading]="isLoading()"
    (submit)="onSubmit($event)"
  >
    <div class="login-links">
      <a class="login-link" routerLink="/auth/recover-account">¿Olvidaste tu contraseña?</a>
      <a class="login-link" routerLink="/auth/register">Crear cuenta</a>
    </div>

    <div class="login-footer">
      <span class="login-footer-text">¿Eres empleado? </span>
      <a class="login-link" routerLink="/auth/employee/login">Accede con tu código de empleado</a>
    </div>
  </sgfidm-login-organism>
</div>
