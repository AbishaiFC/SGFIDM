<div class="password-reset-success-page">
  <sgfidm-auth-card
    title="Tu contraseña se actualizó"
    subtitle="El proceso terminó correctamente. Ya puedes iniciar sesión con tu nueva contraseña."
    [showLogo]="false"
    [wide]="true"
  >
    <div sgfidmAuthCardIcon class="exito-icono" aria-hidden="true">
      <span class="material-symbols-outlined">check</span>
    </div>

    <sgfidm-button type="primary" size="md" [fullWidth]="true" [height]="'56px'" (click)="onIrAlLogin()">
      <span class="material-symbols-outlined exito-flecha" aria-hidden="true">arrow_forward</span>
      Ir al inicio de sesión
    </sgfidm-button>
  </sgfidm-auth-card>
</div>
