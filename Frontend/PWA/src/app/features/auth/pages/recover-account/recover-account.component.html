<div class="recover-account-page">
  <div class="recover-account-card">
    <h1 class="recover-account-title">Recupera tu cuenta</h1>
    <p class="recover-account-subtitle">Escribe el correo con el que te registraste. Te enviaremos instrucciones para
      restablecer tu contraseña.</p>

    <div class="recover-account-body">
      <sgfidm-form-field label="Correo electrónico" type="email" placeholder="nombre@empresa.com" [(value)]="email" />
      <sgfidm-button type="primary" size="md" [fullWidth]="true" [height]="'56px'" [disabled]="isLoading" [loading]="isLoading"
        (click)="onEnviarInstrucciones()">Enviar instrucciones</sgfidm-button>
    </div>

    <div class="recover-account-footer">
      <a class="recover-account-link" (click)="onVolverAlLogin()">Volver al inicio de sesión</a>
    </div>
  </div>
</div>
