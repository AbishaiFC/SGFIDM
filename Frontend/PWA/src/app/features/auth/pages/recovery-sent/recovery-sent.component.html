<div class="recovery-sent-page">
  <sgfidm-auth-card
    title="Instrucciones enviadas"
    subtitle="Si el correo está registrado, enviamos un enlace para restablecer la contraseña a:"
    [showLogo]="false"
    [wide]="true"
  >
    <div class="recovery-sent-email">
      <span class="recovery-sent-email__label">Correo ingresado</span>
      <div class="recovery-sent-email__value">{{ maskedEmail }}</div>
      <p class="recovery-sent-email__helper">
        Si no lo encuentras, revisa la carpeta de correo no deseado.
      </p>
    </div>

    <div class="recovery-sent-actions">
      <sgfidm-button
        type="secondary"
        size="lg"
        [fullWidth]="true"
        [height]="'56px'"
        [loading]="isSending"
        (click)="onEnviarDeNuevo()"
      >
        <sgfidm-icon class="sgfidm-icon recovery-sent-send-icon" [name]="'send'"></sgfidm-icon>
        Enviar de nuevo
      </sgfidm-button>
    </div>

    <div class="recovery-sent-footer">
      <a class="recovery-sent-link" routerLink="/auth/login">
        <sgfidm-icon class="sgfidm-icon recovery-sent-back-icon" [name]="'arrow_back'"></sgfidm-icon>
        Volver al inicio de sesión
      </a>
    </div>
  </sgfidm-auth-card>
</div>
