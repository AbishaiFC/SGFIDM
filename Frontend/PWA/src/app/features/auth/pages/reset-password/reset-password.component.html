<div class="reset-password-page">
  <sgfidm-auth-card
    [title]="enlaceInvalido ? 'Enlace inválido' : 'Crea una nueva contraseña'"
    [subtitle]="enlaceInvalido
      ? 'No se pudo abrir el enlace. Solicita uno nuevo para continuar.'
      : 'Define la nueva contraseña de tu cuenta. No necesitas escribir tu correo otra vez.'"
    [showLogo]="false"
    [wide]="true"
  >
    @if (enlaceInvalido) {
      <div class="reset-password-aviso" role="alert">
        <span class="material-symbols-outlined reset-password-aviso__icon" aria-hidden="true">error_outline</span>
        <div>
          <span class="reset-password-aviso__eyebrow">ENLACE INVÁLIDO</span>
          <span class="reset-password-aviso__text">
            El enlace es incorrecto o ya se usó. Solicita uno nuevo.
          </span>
        </div>
      </div>

      <div class="reset-password-actions">
        <sgfidm-button type="primary" size="lg" [fullWidth]="true" [height]="'56px'" (click)="onSolicitarNuevoEnlace()">
          <span class="material-symbols-outlined reset-password-button-icon" aria-hidden="true">link</span>
          Solicitar nuevo enlace
        </sgfidm-button>
      </div>
    } @else {
      @if (errorMessage) {
        <div class="reset-password-aviso" role="alert">
          <span class="material-symbols-outlined reset-password-aviso__icon" aria-hidden="true">error_outline</span>
          <div>
            <span class="reset-password-aviso__eyebrow">{{ errorEyebrow }}</span>
            <span class="reset-password-aviso__text">{{ errorMessage }}</span>
          </div>
        </div>
      }

      <div class="reset-password-fields">
        <sgfidm-password-field
          label="Nueva contraseña"
          placeholder="Mínimo 8 caracteres"
          helperText="Al menos 8 caracteres, una mayúscula y un número."
          [(value)]="nuevaPassword"
        />
        <sgfidm-password-field
          label="Confirmar nueva contraseña"
          placeholder="Repite la nueva contraseña"
          helperText="Las contraseñas deben coincidir."
          [errorMessage]="confirmError"
          [(value)]="confirmarPassword"
        />
      </div>

      <div class="reset-password-actions">
        <sgfidm-button
          type="primary"
          size="lg"
          [fullWidth]="true"
          [height]="'56px'"
          [loading]="isLoading"
          [disabled]="isLoading"
          (click)="onGuardar()"
        >
          <span class="material-symbols-outlined reset-password-button-icon" aria-hidden="true">archive</span>
          Guardar nueva contraseña
        </sgfidm-button>
      </div>
    }
  </sgfidm-auth-card>
</div>
