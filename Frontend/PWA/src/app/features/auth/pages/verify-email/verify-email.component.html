<div class="verify-email-page">
  <sgfidm-auth-card
    title="Confirma tu correo electrónico"
    subtitle="Enviamos un enlace de verificación a la siguiente dirección:"
    [showLogo]="false"
    [wide]="true"
  >
    <div class="verify-email-body">
      <div class="verify-email-field-row">
        <sgfidm-icon class="sgfidm-icon verify-email-info-icon" [name]="'info'"></sgfidm-icon>
        <sgfidm-form-field label="Correo electrónico" type="email" placeholder="nombre@empresa.com" [(value)]="email" [disabled]="true" />
      </div>

      <sgfidm-button type="primary" size="md" [fullWidth]="true" [height]="'56px'" (click)="onAbrirCorreo()">Abrir mi correo</sgfidm-button>
      <p class="verify-email-helper">Podrás solicitar otro enlace en 60 segundos.</p>

      <div class="verify-email-footer">
        <span class="verify-email-footer-text">¿Ya verificaste tu correo? </span>
        <a class="verify-email-link" (click)="onIniciarSesion()">Iniciar sesión</a>
      </div>
    </div>
  </sgfidm-auth-card>
</div>
