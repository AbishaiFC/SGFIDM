<sgfidm-pos-terminal-organism (pagar)="abrirPago($event)" />

@if (totalPago() !== null) {
  <sgfidm-procesar-pago
    [total]="totalPago()!"
    (cancelar)="cancelarPago()"
    (confirmar)="confirmarPago($event)"
  />
}

@if (ventaConfirmada() !== null) {
  <sgfidm-venta-registrada
    [pago]="ventaConfirmada()!"
    [total]="totalVenta()"
    (cerrar)="cerrarVenta()"
    (verComprobante)="verComprobante()"
    (imprimir)="verComprobante()"
  />
}
