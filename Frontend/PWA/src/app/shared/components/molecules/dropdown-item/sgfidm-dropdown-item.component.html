<button
  type="button"
  class="sgfidm-dropdown-item"
  [class.sgfidm-dropdown-item--disabled]="variant() === 'disabled'"
  [attr.aria-disabled]="variant() === 'disabled' ? true : null"
  (click)="onClick()"
>
  @if (icon()) {
    <sgfidm-icon class="sgfidm-dropdown-item__icon sgfidm-icon" [name]="icon()"></sgfidm-icon>
  }
  <span class="sgfidm-dropdown-item__label">{{ label() }}</span>
</button>
