<div class="sgfidm-pin-field" [class.sgfidm-pin-field--error]="state() === 'error' || !!errorMessage()"
  [class.sgfidm-pin-field--loading]="state() === 'loading'" [class.sgfidm-pin-field--success]="state() === 'success'"
  role="group" [attr.aria-label]="title()">
  <sgfidm-pin-input [label]="title()" [subtitle]="subtitle()" [error]="errorMessage() || null"
    [disabled]="state() === 'loading'" (pinComplete)="onPinComplete($event)" />

  @if (errorMessage()) {
  <p class="sgfidm-pin-field__error" role="alert">
    <sgfidm-icon class="sgfidm-icon sgfidm-pin-field__error-icon" [name]="'error_outline'"></sgfidm-icon>
    {{ errorMessage() }}
  </p>
  }
</div>
