<div class="sgfidm-search-bar" role="search">
  <sgfidm-icon class="sgfidm-search-bar__icon sgfidm-icon" [name]="'search'"></sgfidm-icon>
  <input
    class="sgfidm-search-bar__input"
    type="search"
    [attr.placeholder]="placeholder()"
    [attr.disabled]="disabled() ? true : null"
    [value]="value"
    (input)="onInput($event)"
    (blur)="onBlur()"
    (keydown)="onSearchKeyDown($event)"
  />
  @if (hasValue()) {
    <button
      type="button"
      class="sgfidm-search-bar__clear"
      aria-label="Borrar búsqueda"
      (click)="onClear()"
    >
      <sgfidm-icon class="sgfidm-icon" [name]="'close'"></sgfidm-icon>
    </button>
  }
</div>
