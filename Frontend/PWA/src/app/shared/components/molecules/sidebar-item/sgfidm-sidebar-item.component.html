<button
  type="button"
  class="sgfidm-sidebar-item"
  [class.sgfidm-sidebar-item--active]="variant() === 'active'"
  [class.sgfidm-sidebar-item--disabled]="variant() === 'disabled'"
  [class.sgfidm-sidebar-item--icono]="layout() === 'icon-only'"
  [attr.aria-disabled]="variant() === 'disabled' ? true : null"
  [attr.aria-current]="variant() === 'active' ? 'page' : null"
  [attr.aria-label]="layout() === 'icon-only' ? label() : null"
  [attr.title]="layout() === 'icon-only' ? label() : null"
  (click)="onClick()"
>
  <sgfidm-icon class="sgfidm-sidebar-item__icon sgfidm-icon" [name]="icon()"></sgfidm-icon>
  @if (layout() === 'expanded') {
    <span class="sgfidm-sidebar-item__label">{{ label() }}</span>
  }
</button>
