<sgfidm-auth-card
  [title]="title()"
  [subtitle]="subtitle()"
  [showLogo]="false"
  [wide]="true"
>
  <div class="login-organism-form">
    <sgfidm-form-field
      [label]="emailLabel()"
      type="email"
      [placeholder]="emailPlaceholder()"
      [(ngModel)]="form.email"
      [required]="true"
      [errorMessage]="showEmailError() ? 'Correo electrónico no válido.' : ''"
    />

    <sgfidm-password-field
      [label]="passwordLabel()"
      [placeholder]="passwordPlaceholder()"
      [(value)]="form.password"
      [errorMessage]="showPasswordError() ? 'Contraseña no válida.' : ''"
    />

    @if (errorMessage()) {
      <p class="login-organism-error" role="alert">{{ errorMessage() }}</p>
    }

    <div class="login-organism-actions">
      <sgfidm-button
        type="primary"
        size="md"
        [fullWidth]="true"
        [height]="'56px'"
        [disabled]="busy() || !form.email || !form.password"
        [loading]="busy()"
        (click)="onSubmit()"
      >
        <span class="login-organism-button-text">Iniciar sesión</span>
      </sgfidm-button>
    </div>

    <ng-content />
  </div>
</sgfidm-auth-card>
